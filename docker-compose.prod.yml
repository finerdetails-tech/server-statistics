services:
  backend:
    build: ./backend
    volumes:
     - db-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/server_statistics.db
    env_file: ".env"
    ports:
      - "8080:8080"
  frontend:
    build: ./frontend
    env_file: ".env"
    ports:
      - "3000:3000"
  
volumes:
  db-data:
    name: "server_statistics_db_data"