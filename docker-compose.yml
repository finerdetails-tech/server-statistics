services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
    - ./backend/:/app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    
  pimond:
    build: ./pimond
    env_file: ".env"
    environment:
      - SERVER_URL=http://backend:8080/api/metrics
    volumes:
    - ./pimond/:/app
    depends_on:
      backend:
        condition: service_healthy